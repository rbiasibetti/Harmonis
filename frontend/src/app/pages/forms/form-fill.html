@if (form(); as f) {
  <div class="page-head">
    <div>
      <a class="muted back" routerLink="/forms">← Formulários</a>
      <h1>{{ f.name }}</h1>
      @if (f.description) { <p class="muted">{{ f.description }}</p> }
    </div>
  </div>

  <div class="card fill-card">
    @if (done()) {
      <p class="notice success">Resposta enviada com sucesso!</p>
      <button class="btn btn-ghost" (click)="again()">Enviar outra</button>
    } @else {
      @if (error()) { <p class="notice error">{{ error() }}</p> }

      <app-form-renderer [fields]="requesterFields(f)" [values]="values" [errors]="errors()" [formId]="f.id"></app-form-renderer>

      <div class="modal-foot">
        <button class="btn btn-primary" (click)="submit()" [disabled]="saving()">
          {{ saving() ? 'Enviando…' : 'Enviar' }}
        </button>
      </div>
    }
  </div>
} @else {
  <p class="muted">{{ loading() ? 'Carregando…' : (error() || 'Formulário indisponível.') }}</p>
}
