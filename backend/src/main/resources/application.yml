server:
  port: 8080
  error:
    # Inclui a mensagem da ResponseStatusException no corpo do erro (ex.: motivo da
    # validacao do fluxo), para o frontend exibir ao usuario em vez de um 400 generico.
    include-message: always

harmonis:
  # Conexao base ao SQL Server local. Cada tenant tem seu proprio banco (db-per-tenant);
  # as tabelas do Harmonis convivem com as de outros sistemas, por isso o prefixo hm_.
  sqlserver:
    host: ${HARMONIS_DB_HOST:localhost}
    port: ${HARMONIS_DB_PORT:1433}
    user: ${HARMONIS_DB_USER:sa}
    password: ${HARMONIS_DB_PASSWORD:SQLServer2001}
    # encrypt+trust para instancia local sem certificado valido
    options: ";encrypt=true;trustServerCertificate=true;loginTimeout=15"
  catalog:
    db-name: ${HARMONIS_CATALOG_DB:harmonis_catalog}
  jwt:
    secret: ${HARMONIS_JWT_SECRET:troque-esta-chave-em-producao-com-no-minimo-32-bytes!!}
    # Access token curto; a sessao e mantida pelo refresh token (rotativo, em cookie HttpOnly).
    ttl-minutes: ${HARMONIS_JWT_TTL:15}
    refresh-ttl-days: ${HARMONIS_REFRESH_TTL_DAYS:7}
    refresh-absolute-days: ${HARMONIS_REFRESH_ABSOLUTE_DAYS:30}
    refresh-reuse-grace-seconds: ${HARMONIS_REFRESH_GRACE:10}
  cookies:
    secure: ${HARMONIS_COOKIE_SECURE:false}
    same-site: ${HARMONIS_COOKIE_SAMESITE:Strict}
    domain: ${HARMONIS_COOKIE_DOMAIN:}
  secrets:
    # Chave de cifragem (AES-256-GCM) dos segredos das integracoes (senhas, tokens, api keys).
    # TROQUE em producao e nao a perca: sem ela os segredos gravados nao podem ser decifrados.
    key: ${HARMONIS_SECRET_KEY:troque-esta-chave-de-cifragem-em-producao-32-bytes!!}
  webhooks:
    # false = bloqueia destinos em rede privada/loopback (protecao SSRF). Link-local
    # (169.254.0.0/16, ex.: metadados de nuvem) e SEMPRE bloqueado. Use true p/ ERPs internos.
    allow-private-networks: ${HARMONIS_WEBHOOK_ALLOW_PRIVATE:false}
    pool-size: ${HARMONIS_WEBHOOK_POOL:4}
    # Espera (s) antes de cada retentativa (tentativas = 1 + retries da integracao)
    retry-delays-seconds: ${HARMONIS_WEBHOOK_RETRY_DELAYS:5,30,120,300,600}
  cors:
    allowed-origins: ${HARMONIS_CORS:http://localhost:4200,http://127.0.0.1:4200}
  storage:
    # Raiz dos arquivos de documentos (disco privado; nunca servidos diretamente).
    # Separado por tenant em subpastas: <root>/<tenant>/<ulid>.ext
    documents-dir: ${HARMONIS_DOCS_DIR:storage/documents}

spring:
  application:
    name: harmonis
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # schema gerido manualmente via migrations/ (sem Flyway)
    database-platform: org.hibernate.dialect.SQLServerDialect
    properties:
      # Dialeto fixado -> Hibernate NAO abre conexao no startup (nao ha tenant no contexto ainda)
      hibernate.boot.allow_jdbc_metadata_access: false
      hibernate.format_sql: false

logging:
  level:
    app.harmonis: INFO
